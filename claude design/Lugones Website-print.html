<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Lugones Procedure for Scimitar Syndrome</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #0B1F3A; font-family: 'Space Grotesk', sans-serif; color: #fff; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0B1F3A; }
    ::-webkit-scrollbar-thumb { background: #B52430; border-radius: 3px; }
    ::selection { background: rgba(181,36,48,0.3); }

    @media print {
      @page { size: A4; margin: 0; }
      html, body {
        background: #0B1F3A !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        overflow: visible !important;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      /* Hide the fixed nav so it doesn't repeat on every page */
      nav[style*="position: fixed"], nav[style*="position:fixed"] {
        position: static !important;
        background: rgba(11,31,58,0.97) !important;
        border-bottom: 1px solid rgba(255,255,255,0.07) !important;
      }
      /* Section page breaks — sections are major <section> blocks */
      section {
        break-inside: avoid-page;
        page-break-inside: avoid;
      }
      /* Avoid splitting headings from content */
      h1, h2, h3 { break-after: avoid; page-break-after: avoid; }
      /* Remove animations / transitions */
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── TOKENS ─── */
const NAVY    = '#0B1F3A';
const NAVY2   = '#0F2745';
const CRIMSON = '#B52430';
const CRIMSON2= '#8B1C28';
const GOLD    = '#C8933F';
const WHITE   = '#FFFFFF';
const OFFWHITE= '#F5F0EB';

/* ─── LOGO ICON ─── */
const LogoIcon = ({ size = 36, onLight = false }) => {
  const acc = onLight ? NAVY : CRIMSON;
  const bg  = onLight ? WHITE : NAVY;
  return (
    <svg viewBox="0 0 68 80" width={size * 68/80} height={size} fill="none">
      <path d="M 30 7 C 46 5 66 20 64 50 C 63 55 61 58 58 60 C 55 62 52 61 50 58 C 48 55 52 50 52 44 C 52 28 38 14 32 11 C 30 10 28 8 30 7 Z" fill={acc} opacity="0.22"/>
      <path d="M 32 11 C 44 16 54 30 54 46" stroke={acc} strokeWidth="1.5" strokeLinecap="round" opacity="0.35"/>
      <circle cx="58" cy="60" r="9.5" fill={acc}/>
      <circle cx="58" cy="60" r="3.5" fill={bg}/>
      <path d="M 58 60 C 46 54 26 46 8 50" stroke={acc} strokeWidth="5.5" strokeLinecap="round"/>
      <circle cx="8" cy="50" r="5" fill={acc}/>
      <circle cx="30" cy="7" r="3" fill={acc} opacity="0.28"/>
      <path d="M 30 7 C 46 5 66 20 64 50 C 63 55 61 58 58 60" stroke={acc} strokeWidth="2.5" strokeLinecap="round" opacity="0.18"/>
    </svg>
  );
};

/* ─── NAV ─── */
const NAV_LINKS = [
  { label: 'The Syndrome', href: '#syndrome' },
  { label: 'The Procedure', href: '#procedure' },
  { label: 'Results', href: '#results' },
  { label: 'For Patients', href: '#patients' },
  { label: 'For Surgeons', href: '#surgeons' },
  { label: 'The Center', href: '#center' },
];

const Nav = ({ active }) => {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 60);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);

  return (
    <nav style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 1000,
      background: scrolled ? 'rgba(11,31,58,0.97)' : 'transparent',
      borderBottom: scrolled ? '1px solid rgba(255,255,255,0.07)' : 'none',
      backdropFilter: scrolled ? 'blur(12px)' : 'none',
      transition: 'all 0.3s ease',
      padding: '0 48px',
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      height: 68,
    }}>
      {/* Logo */}
      <a href="#hero" style={{ display: 'flex', alignItems: 'center', gap: 12, textDecoration: 'none' }}>
        <LogoIcon size={34} />
        <div>
          <div style={{ fontWeight: 700, fontSize: 15, color: WHITE, letterSpacing: '-0.01em', lineHeight: 1 }}>LUGONES</div>
          <div style={{ fontWeight: 400, fontSize: 8, color: CRIMSON, letterSpacing: '0.2em', textTransform: 'uppercase', marginTop: 2 }}>PROCEDURE</div>
        </div>
      </a>
      {/* Links */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 32 }}>
        {NAV_LINKS.map(l => (
          <a key={l.href} href={l.href} style={{
            fontWeight: 400, fontSize: 13, letterSpacing: '0.01em',
            color: active === l.href.slice(1) ? WHITE : 'rgba(255,255,255,0.5)',
            textDecoration: 'none', transition: 'color 0.2s',
            borderBottom: active === l.href.slice(1) ? `1px solid ${CRIMSON}` : '1px solid transparent',
            paddingBottom: 2,
          }}>{l.label}</a>
        ))}
        <a href="#contact" style={{
          background: CRIMSON, color: WHITE, fontWeight: 600, fontSize: 12,
          letterSpacing: '0.04em', padding: '9px 20px', borderRadius: 4,
          textDecoration: 'none', whiteSpace: 'nowrap',
        }}>Schedule a Consultation</a>
      </div>
    </nav>
  );
};

/* ─── SECTION WRAPPER ─── */
const Section = ({ id, bg = NAVY, children, style = {} }) => (
  <section id={id} data-screen-label={id} style={{ background: bg, ...style }}>{children}</section>
);

const Container = ({ children, style = {} }) => (
  <div style={{ maxWidth: 1160, margin: '0 auto', padding: '0 48px', ...style }}>{children}</div>
);

/* ─── SECTION LABEL ─── */
const SectionLabel = ({ n, text, light = false }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
    <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 11, color: CRIMSON, letterSpacing: '0.03em' }}>{String(n).padStart(2, '0')}</div>
    <div style={{ width: 32, height: 1, background: CRIMSON }}/>
    <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 500, fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: light ? 'rgba(11,31,58,0.4)' : 'rgba(255,255,255,0.35)' }}>{text}</div>
  </div>
);

/* ─── STAT CARD ─── */
const StatCard = ({ number, unit = '', label, light = false }) => (
  <div style={{
    background: light ? 'rgba(11,31,58,0.06)' : 'rgba(255,255,255,0.05)',
    border: `1px solid ${light ? 'rgba(11,31,58,0.1)' : 'rgba(255,255,255,0.08)'}`,
    borderRadius: 10, padding: '24px 28px',
  }}>
    <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
      <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 44, letterSpacing: '-0.03em', color: light ? NAVY : WHITE, lineHeight: 1 }}>{number}</div>
      {unit && <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 500, fontSize: 16, color: CRIMSON }}>{unit}</div>}
    </div>
    <div style={{ fontFamily: "'DM Sans'", fontWeight: 400, fontSize: 13, color: light ? 'rgba(11,31,58,0.5)' : 'rgba(255,255,255,0.45)', marginTop: 6, lineHeight: 1.4 }}>{label}</div>
  </div>
);

/* ─── HERO ─── */
const Hero = () => (
  <Section id="hero" style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', position: 'relative', overflow: 'hidden', paddingTop: 68 }}>
    {/* Background scimitar shape */}
    <div style={{ position: 'absolute', right: -80, top: '50%', transform: 'translateY(-50%)', opacity: 0.04, pointerEvents: 'none' }}>
      <svg viewBox="0 0 400 480" width={480} height={480} fill="none">
        <path d="M 160 40 C 280 30 400 120 385 300 C 378 330 365 348 345 360 C 325 372 305 365 295 348 C 285 330 310 300 310 265 C 310 168 226 84 190 65 C 178 60 165 50 160 40 Z" fill={WHITE}/>
        <path d="M 190 65 C 266 96 325 180 325 275" stroke={WHITE} strokeWidth="9" strokeLinecap="round" opacity="0.6"/>
        <circle cx="345" cy="360" r="57" fill={WHITE}/>
        <circle cx="345" cy="360" r="21" fill={NAVY}/>
        <path d="M 345 360 C 273 324 156 276 48 300" stroke={WHITE} strokeWidth="33" strokeLinecap="round"/>
        <circle cx="48" cy="300" r="30" fill={WHITE}/>
      </svg>
    </div>

    <Container style={{ paddingTop: 80, paddingBottom: 100 }}>
      <div style={{ maxWidth: 720 }}>
        <SectionLabel n={1} text="International Reference Center · Buenos Aires" />
        <h1 style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 64, letterSpacing: '-0.03em', lineHeight: 1.04, marginBottom: 24, textWrap: 'balance' }}>
          The World's Reference<br/>
          <span style={{ color: CRIMSON }}>for Scimitar Syndrome</span><br/>
          Repair
        </h1>
        <p style={{ fontFamily: "'DM Sans'", fontWeight: 300, fontSize: 18, lineHeight: 1.7, color: 'rgba(255,255,255,0.6)', marginBottom: 40, maxWidth: 560, textWrap: 'pretty' }}>
          Dr. Ignacio Lugones invented a pericardial tunnel technique that achieves tension-free repair with zero reoperations — now adopted in 11 institutions across 3 continents.
        </p>
        <div style={{ display: 'flex', gap: 12, marginBottom: 72 }}>
          <a href="#contact" style={{ background: CRIMSON, color: WHITE, fontWeight: 600, fontSize: 14, letterSpacing: '0.03em', padding: '14px 28px', borderRadius: 5, textDecoration: 'none' }}>
            Schedule a Consultation →
          </a>
          <a href="#procedure" style={{ border: '1px solid rgba(255,255,255,0.2)', color: 'rgba(255,255,255,0.8)', fontWeight: 400, fontSize: 14, padding: '14px 28px', borderRadius: 5, textDecoration: 'none' }}>
            Learn the Procedure
          </a>
        </div>
        {/* Stats row */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12 }}>
          <StatCard number="38" label="patients operated across 11 institutions" />
          <StatCard number="0" label="deaths or reoperations at mid-term follow-up" />
          <StatCard number="13.5" unit="y" label="maximum follow-up with no obstruction" />
          <StatCard number="11" label="international centers have adopted the technique" />
        </div>
      </div>
    </Container>
  </Section>
);

/* ─── THE SYNDROME ─── */
const Syndrome = () => {
  const [view, setView] = useState('patient');
  return (
    <Section id="syndrome" bg={'#FFFFFF'} style={{ padding: '120px 0' }}>
      <Container>
        <SectionLabel n={2} text="The Syndrome" light />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 80, alignItems: 'start' }}>
          <div>
            <h2 style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 44, letterSpacing: '-0.02em', lineHeight: 1.1, marginBottom: 24, color: NAVY }}>
              What is Scimitar<br/>Syndrome?
            </h2>
            {/* Toggle */}
            <div style={{ display: 'flex', gap: 0, marginBottom: 28, background: 'rgba(11,31,58,0.06)', borderRadius: 6, padding: 3, width: 'fit-content' }}>
              {[{ k: 'patient', l: 'For Patients' }, { k: 'surgeon', l: 'For Surgeons' }].map(({ k, l }) => (
                <button key={k} onClick={() => setView(k)} style={{
                  background: view === k ? CRIMSON : 'transparent',
                  border: 'none', color: view === k ? WHITE : 'rgba(11,31,58,0.55)',
                  fontFamily: "'Space Grotesk'", fontWeight: 500, fontSize: 12,
                  letterSpacing: '0.04em', padding: '7px 18px', borderRadius: 4, cursor: 'pointer',
                  transition: 'all 0.2s',
                }}>{l}</button>
              ))}
            </div>

            {view === 'patient' ? (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
                <p style={{ fontFamily: "'DM Sans'", fontWeight: 400, fontSize: 16, lineHeight: 1.75, color: 'rgba(11,31,58,0.7)', textWrap: 'pretty' }}>
                  Scimitar syndrome is a rare heart defect present from birth. In a healthy heart, blood from the lungs flows directly into the left side of the heart. In scimitar syndrome, a vein from the right lung takes a wrong path — draining into the wrong chamber and creating an extra workload on the heart.
                </p>
                <p style={{ fontFamily: "'DM Sans'", fontWeight: 400, fontSize: 16, lineHeight: 1.75, color: 'rgba(11,31,58,0.7)', textWrap: 'pretty' }}>
                  The name comes from the curved shape this misrouted vein makes on a chest X-ray — resembling a scimitar, a type of curved sword.
                </p>
                <div style={{ background: 'rgba(181,36,48,0.07)', border: '1px solid rgba(181,36,48,0.2)', borderRadius: 8, padding: '16px 20px' }}>
                  <p style={{ fontFamily: "'DM Sans'", fontWeight: 400, fontSize: 14, lineHeight: 1.65, color: 'rgba(11,31,58,0.75)' }}>
                    <strong style={{ color: NAVY }}>The good news:</strong> When repaired with the Lugones procedure, patients achieve excellent outcomes with no reoperations needed.
                  </p>
                </div>
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
                <p style={{ fontFamily: "'DM Sans'", fontWeight: 400, fontSize: 15, lineHeight: 1.75, color: 'rgba(11,31,58,0.7)', textWrap: 'pretty' }}>
                  Scimitar syndrome is characterized by partial anomalous pulmonary venous return from the right lung, most commonly draining into the inferior vena cava. It is frequently associated with right lung hypoplasia, dextroposition of the heart, anomalous systemic arterial supply, and atrial septal defect.
                </p>
                <p style={{ fontFamily: "'DM Sans'", fontWeight: 400, fontSize: 15, lineHeight: 1.75, color: 'rgba(11,31,58,0.7)', textWrap: 'pretty' }}>
                  Conventional repair — intracardiac baffling or reimplantation — carries high rates of pulmonary venous obstruction (46% and 63% respectively in large series). The Lugones procedure circumvents this through an autologous pericardial tunnel, achieving wide-lumen, tension-free redirection.
                </p>
              </div>
            )}
          </div>

          {/* Diagram placeholder */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
            <div style={{ background: 'rgba(11,31,58,0.03)', border: '1px solid rgba(11,31,58,0.1)', borderRadius: 12, aspectRatio: '4/3', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12 }}>
              <svg viewBox="0 0 68 80" width={60} height={60} fill="none" opacity={0.35}>
                <path d="M 30 7 C 46 5 66 20 64 50 C 63 55 61 58 58 60 C 55 62 52 61 50 58 C 48 55 52 50 52 44 C 52 28 38 14 32 11 C 30 10 28 8 30 7 Z" fill={NAVY}/>
                <circle cx="58" cy="60" r="9.5" fill={NAVY}/>
                <path d="M 58 60 C 46 54 26 46 8 50" stroke={NAVY} strokeWidth="5.5" strokeLinecap="round"/>
                <circle cx="8" cy="50" r="5" fill={NAVY}/>
              </svg>
              <div style={{ fontFamily: "'Space Grotesk'", fontSize: 11, color: 'rgba(11,31,58,0.35)', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Anatomical diagram</div>
              <div style={{ fontFamily: "'DM Sans'", fontSize: 11, fontStyle: 'italic', color: 'rgba(11,31,58,0.25)' }}>Asset to be provided by Dr. Lugones</div>
            </div>
            {/* Why classical fails */}
            <div style={{ background: 'rgba(181,36,48,0.05)', border: '1px solid rgba(181,36,48,0.2)', borderRadius: 10, padding: '20px 24px' }}>
              <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 600, fontSize: 13, color: CRIMSON, marginBottom: 12, letterSpacing: '0.02em' }}>Why classical techniques fail</div>
              {[
                'Intracardiac baffling: 46% obstruction rate',
                'Reimplantation: 63% obstruction rate',
                'Tension on the vein causes scarring and closure',
                'Long tunnel distance leads to kinking',
              ].map((item, i) => (
                <div key={i} style={{ display: 'flex', gap: 10, alignItems: 'flex-start', marginBottom: i < 3 ? 8 : 0 }}>
                  <div style={{ width: 4, height: 4, borderRadius: '50%', background: CRIMSON, marginTop: 6, flexShrink: 0 }}/>
                  <div style={{ fontFamily: "'DM Sans'", fontSize: 13, color: 'rgba(11,31,58,0.65)', lineHeight: 1.5 }}>{item}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </Container>
    </Section>
  );
};

/* ─── THE PROCEDURE ─── */
const Procedure = () => {
  const [variant, setVariant] = useState(0);
  const variants = [
    { label: 'Original', desc: 'The scimitar vein is sutured to the pericardium, which acts as a natural wide-lumen tunnel routing blood directly into the left atrium. No synthetic material. No tension.', video: 'assets/variant-original.mp4' },
    { label: 'Variant A', desc: 'Atrial septum repositioning for cases where the left atrium is small or the scimitar vein inserts high. The septum is moved to enlarge the left atrial volume.', video: 'assets/variant-a.mp4' },
    { label: 'Variant B', desc: 'An interatrial pericardial flap is used to bridge the connection when standard tunneling is insufficient due to anatomical constraints.', video: 'assets/variant-b.mp4' },
  ];
  return (
    <Section id="procedure" style={{ padding: '120px 0', background: NAVY }}>
      <Container>
        <SectionLabel n={3} text="The Procedure" />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 80, marginBottom: 80 }}>
          <div>
            <h2 style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 44, letterSpacing: '-0.02em', lineHeight: 1.1, marginBottom: 24 }}>
              The Pericardial<br/>
              <span style={{ color: CRIMSON }}>Tunnel Technique</span>
            </h2>
            <p style={{ fontFamily: "'DM Sans'", fontWeight: 400, fontSize: 16, lineHeight: 1.75, color: 'rgba(255,255,255,0.6)', marginBottom: 24, textWrap: 'pretty' }}>
              Instead of constructing a synthetic tube or creating an internal baffle, the Lugones procedure uses the pericardium — the natural sac surrounding the heart — as a ready-made biological tunnel.
            </p>
            <p style={{ fontFamily: "'DM Sans'", fontWeight: 400, fontSize: 16, lineHeight: 1.75, color: 'rgba(255,255,255,0.6)', textWrap: 'pretty' }}>
              The scimitar vein is sutured to the pericardium, which guides blood tension-free into the left atrium. The body's own tissue provides a wide, living conduit that grows with the patient and never scars shut.
            </p>
          </div>
          {/* Step diagram */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            {[
              { n: '01', t: 'Identify the anomalous vein', d: 'The scimitar vein is identified as it descends toward the inferior vena cava.' },
              { n: '02', t: 'Open the pericardium', d: 'The pericardial sac is opened to create a natural tunnel pathway.' },
              { n: '03', t: 'Suture vein to pericardium', d: 'The vein is sutured to the pericardial wall — no synthetic graft needed.' },
              { n: '04', t: 'Close and redirect', d: 'Blood now flows tension-free through the pericardial tunnel into the left atrium.' },
            ].map(({ n, t, d }) => (
              <div key={n} style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
                <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 13, color: CRIMSON, minWidth: 28, paddingTop: 1 }}>{n}</div>
                <div>
                  <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 600, fontSize: 14, color: WHITE, marginBottom: 3 }}>{t}</div>
                  <div style={{ fontFamily: "'DM Sans'", fontSize: 13, color: 'rgba(255,255,255,0.5)', lineHeight: 1.55 }}>{d}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* 3 Variants */}
        <div style={{ borderTop: '1px solid rgba(255,255,255,0.07)', paddingTop: 60 }}>
          <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 500, fontSize: 11, color: 'rgba(255,255,255,0.3)', letterSpacing: '0.18em', textTransform: 'uppercase', marginBottom: 28 }}>
            Three surgical variants — adaptable to any anatomy
          </div>
          <div style={{ display: 'flex', gap: 0, marginBottom: 32, background: 'rgba(255,255,255,0.05)', borderRadius: 8, padding: 4, width: 'fit-content' }}>
            {variants.map(({ label }, i) => (
              <button key={i} onClick={() => setVariant(i)} style={{
                background: variant === i ? CRIMSON : 'transparent',
                border: 'none', color: variant === i ? WHITE : 'rgba(255,255,255,0.5)',
                fontFamily: "'Space Grotesk'", fontWeight: 500, fontSize: 13,
                padding: '9px 24px', borderRadius: 6, cursor: 'pointer', transition: 'all 0.2s',
              }}>{label}</button>
            ))}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '7fr 5fr', gap: 24, alignItems: 'start' }}>
            {/* Video */}
            <div style={{ background: '#000', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 10, overflow: 'hidden', aspectRatio: '16/10', position: 'relative' }}>
              <video
                key={variants[variant].video}
                src={variants[variant].video}
                autoPlay
                loop
                muted
                playsInline
                controls
                style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
              />
            </div>
            {/* Description */}
            <div style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 10, padding: '28px 32px' }}>
              <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 500, fontSize: 10, color: CRIMSON, letterSpacing: '0.18em', textTransform: 'uppercase', marginBottom: 10 }}>Surgical animation</div>
              <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 600, fontSize: 18, color: WHITE, marginBottom: 12 }}>{variants[variant].label}</div>
              <div style={{ fontFamily: "'DM Sans'", fontSize: 14, color: 'rgba(255,255,255,0.6)', lineHeight: 1.7 }}>{variants[variant].desc}</div>
            </div>
          </div>
        </div>
      </Container>
    </Section>
  );
};

/* ─── RESULTS ─── */
const Results = () => (
  <Section id="results" bg={CRIMSON2} style={{ padding: '120px 0' }}>
    <Container>
      <SectionLabel n={4} text="Clinical Results" />
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 80, alignItems: 'center' }}>
        <div>
          <h2 style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 44, letterSpacing: '-0.02em', lineHeight: 1.1, marginBottom: 24 }}>

/* ─── APP ─── */
const App = () => {
  const [activeSection, setActiveSection] = useState('hero');

  useEffect(() => {
    const sections = document.querySelectorAll('section[id]');
    const observer = new IntersectionObserver(
      entries => {
        entries.forEach(e => { if (e.isIntersecting) setActiveSection(e.target.id); });
      },
      { threshold: 0.4 }
    );
    sections.forEach(s => observer.observe(s));
    return () => observer.disconnect();
  }, []);

  return (
    <div>
      <Nav active={activeSection} />
      <Hero />
      <Syndrome />
      <Procedure />
      <Results />
      <Patients />
      <Surgeons />
      <Center />
      <Contact />
      <Footer />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  // Wait for React tree + images to settle
