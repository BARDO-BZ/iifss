<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Lugones Procedure — Identity System</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a1a; font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ─────────────────────────────────────────
   DESIGN TOKENS
───────────────────────────────────────── */
const P1 = { bg: '#0B1F3A', accent: '#C8933F', light: '#F5F0E8', mid: '#8DA6C4', name: 'Navy × Gold' };
const P2 = { bg: '#0B1F3A', accent: '#A8303A', light: '#F5EEF0', mid: '#C48D98', name: 'Navy × Crimson' };
const P3 = { bg: '#0B1F3A', accent: '#1BA8C2', light: '#EAF6FA', mid: '#7ACEDA', name: 'Navy × Teal' };
const P4 = { bg: '#17082E', accent: '#C9913B', light: '#F8F4ED', mid: '#9B8870', name: 'Midnight × Gold' };

/* ─────────────────────────────────────────
   SVG ICONS
───────────────────────────────────────── */

// ICON 4 — "The Scimitar" — the anomalous vein shape as seen on chest X-ray
const ScimitarIcon = ({ size = 80, accent = P4.accent, bg = P4.bg, onLight = false }) => (
  <svg viewBox="0 0 64 80" width={size * 64 / 80} height={size} fill="none" xmlns="http://www.w3.org/2000/svg">
    {/* Scimitar blade — filled shape */}
    <path
      d="M 12 72 C 2 52 4 26 22 10 C 38 -4 60 2 60 12 C 60 20 46 22 34 30 C 22 38 18 52 14 72 Z"
      fill={accent}
    />
    {/* Blade highlight — inner lighter strip along spine */}
    <path
      d="M 20 66 C 14 50 16 30 28 16 C 38 4 56 4 58 12"
      fill="none"
      stroke={onLight ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.2)'}
      strokeWidth="2"
      strokeLinecap="round"
    />
    {/* Repair node at the tip — the pericardial tunnel (the Lugones fix) */}
    <circle cx="60" cy="12" r="6" fill={onLight ? '#FFFFFF' : bg} stroke={accent} strokeWidth="2.5" />
    <circle cx="60" cy="12" r="2.5" fill={accent} />
    {/* Guard at handle base */}
    <rect x="8" y="70" width="12" height="4" rx="2" fill={accent} opacity="0.55" />
  </svg>
);

// ICON 1 — "The Arch" — architectural tunnel cross-section
const ArchIcon = ({ size = 80, accent = P1.accent, bg = P1.bg, onLight = false }) => {
  const cutBg = onLight ? '#FFFFFF' : bg;
  return (
    <svg viewBox="0 0 80 62" width={size} height={size * 62 / 80} fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 5 62 L 5 30 A 35 35 0 0 1 75 30 L 75 62 Z" fill={accent} />
      <path d="M 17 62 L 17 37 A 23 23 0 0 1 63 37 L 63 62 Z" fill={cutBg} />
    </svg>
  );
};

// ICON 2 — "The Reroute" — a fluid scimitar curve caught and redirected
const RerouteIcon = ({ size = 80, accent = P2.accent, bg = P2.bg, onLight = false }) => (
  <svg viewBox="0 0 72 80" width={size * 72 / 80} height={size} fill="none" xmlns="http://www.w3.org/2000/svg">
    {/* Anomalous scimitar vein path (wrong direction — downward, faded) */}
    <path d="M 28 6 C 36 20 52 36 54 68" stroke={accent} strokeWidth="3.5" strokeLinecap="round" opacity="0.28" />
    {/* Pericardial tunnel node — the catch point */}
    <circle cx="44" cy="48" r="8" fill={accent} />
    {/* Rerouted path (correct — going up-left to left atrium) */}
    <path d="M 44 40 C 40 28 18 22 10 8" stroke={accent} strokeWidth="5" strokeLinecap="round" />
    {/* Left atrium terminal node */}
    <circle cx="10" cy="8" r="5" fill={accent} />
    {/* Scimitar start */}
    <circle cx="28" cy="6" r="3.5" fill={accent} opacity="0.3" />
  </svg>
);

// ICON 3 — "The Circuit" — a clean schematic/node diagram
const CircuitIcon = ({ size = 80, accent = P3.accent, bg = P3.bg, onLight = false }) => (
  <svg viewBox="0 0 72 80" width={size * 72 / 80} height={size} fill="none" xmlns="http://www.w3.org/2000/svg">
    {/* Incoming vein (vertical drop) */}
    <line x1="24" y1="8" x2="24" y2="50" stroke={accent} strokeWidth="4" strokeLinecap="round" />
    {/* Horizontal redirect */}
    <line x1="24" y1="50" x2="56" y2="50" stroke={accent} strokeWidth="4" strokeLinecap="round" />
    {/* Vertical up (to left atrium) */}
    <line x1="56" y1="50" x2="56" y2="14" stroke={accent} strokeWidth="4" strokeLinecap="round" />
    {/* Rerouting node */}
    <circle cx="24" cy="50" r="7" fill={accent} />
    {/* Left atrium terminal */}
    <circle cx="56" cy="14" r="6" fill="none" stroke={accent} strokeWidth="4" />
    <circle cx="56" cy="14" r="2.5" fill={accent} />
    {/* Arrowhead at bottom of incoming (showing original wrong path) */}
    <path d="M 19 42 L 24 50 L 29 42" fill="none" stroke={accent} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.35" />
  </svg>
);

/* ─────────────────────────────────────────
   LOGOTYPE
───────────────────────────────────────── */
const Logotype = ({ accent, size = 1, white = false }) => {
  const col = white ? '#FFFFFF' : '#0B1F3A';
  const fs = 34 * size;
  return (
    <div style={{ lineHeight: 1, userSelect: 'none' }}>
      <div style={{
        fontFamily: "'Space Grotesk', sans-serif",
        fontWeight: 700,
        fontSize: fs,
        color: col,
        letterSpacing: '-0.01em',
      }}>LUGONES</div>
      <div style={{
        fontFamily: "'Space Grotesk', sans-serif",
        fontWeight: 400,
        fontSize: fs * 0.38,
        color: accent,
        letterSpacing: '0.22em',
        textTransform: 'uppercase',
        marginTop: 4 * size,
      }}>PROCEDURE</div>
      <div style={{
        fontFamily: "'DM Sans', sans-serif",
        fontWeight: 300,
        fontSize: fs * 0.26,
        color: white ? 'rgba(255,255,255,0.55)' : 'rgba(11,31,58,0.45)',
        letterSpacing: '0.08em',
        marginTop: 5 * size,
        fontStyle: 'italic',
      }}>for Scimitar Syndrome</div>
    </div>
  );
};

/* ─────────────────────────────────────────
   HORIZONTAL LOCKUP
───────────────────────────────────────── */
const HorizLockup = ({ Icon, palette, white = false, onLight }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 24 }}>
    <Icon size={72} accent={palette.accent} bg={palette.bg} onLight={onLight} />
    <div style={{ width: 1, height: 68, background: white ? 'rgba(255,255,255,0.2)' : 'rgba(11,31,58,0.15)' }} />
    <Logotype accent={palette.accent} size={0.82} white={white} />
  </div>
);

/* ─────────────────────────────────────────
   STACKED LOCKUP
───────────────────────────────────────── */
const StackedLockup = ({ Icon, palette, white = false, onLight }) => (
  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20 }}>
    <Icon size={88} accent={palette.accent} bg={palette.bg} onLight={onLight} />
    <div style={{ textAlign: 'center' }}>
      <Logotype accent={palette.accent} size={0.88} white={white} />
    </div>
  </div>
);

/* ─────────────────────────────────────────
   PALETTE SWATCH ROW
───────────────────────────────────────── */
const PaletteBoard = ({ palette }) => {
  const colors = [
    { hex: palette.bg, label: 'Primary', name: 'Deep Navy' },
    { hex: palette.accent, label: 'Accent', name: 'Signature' },
    { hex: palette.mid, label: 'Mid', name: 'Tint' },
    { hex: palette.light, label: 'Light', name: 'Surface' },
    { hex: '#FFFFFF', label: 'White', name: 'White' },
  ];
  return (
    <div style={{ display: 'flex', gap: 0, height: '100%', width: '100%', borderRadius: 4, overflow: 'hidden' }}>
      {colors.map(c => (
        <div key={c.hex} style={{ flex: 1, background: c.hex, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', padding: '12px 10px' }}>
          <div style={{
            fontFamily: "'Space Grotesk', sans-serif",
            fontSize: 10,
            fontWeight: 600,
            color: ['#FFFFFF', palette.light, palette.mid].includes(c.hex) ? '#0B1F3A' : 'rgba(255,255,255,0.9)',
            letterSpacing: '0.1em',
            textTransform: 'uppercase',
            marginBottom: 2,
          }}>{c.label}</div>
          <div style={{
            fontFamily: "'Space Grotesk', sans-serif",
            fontSize: 9,
            color: ['#FFFFFF', palette.light, palette.mid].includes(c.hex) ? 'rgba(11,31,58,0.5)' : 'rgba(255,255,255,0.5)',
            letterSpacing: '0.05em',
          }}>{c.hex}</div>
        </div>
      ))}
    </div>
  );
};

/* ─────────────────────────────────────────
   PROPOSAL CARD — LIGHT
───────────────────────────────────────── */
const ProposalLight = ({ Icon, palette, num }) => (
  <div style={{ width: '100%', height: '100%', background: '#FAFAFA', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 60, position: 'relative' }}>
    <div style={{ position: 'absolute', top: 28, left: 32, fontFamily: "'Space Grotesk'", fontSize: 10, fontWeight: 600, letterSpacing: '0.2em', color: 'rgba(11,31,58,0.25)', textTransform: 'uppercase' }}>
      Proposal {num.toString().padStart(2,'0')} · {palette.name} · Light
    </div>
    <HorizLockup Icon={Icon} palette={palette} white={false} onLight={true} />
  </div>
);

/* ─────────────────────────────────────────
   PROPOSAL CARD — DARK
───────────────────────────────────────── */
const ProposalDark = ({ Icon, palette, num }) => (
  <div style={{ width: '100%', height: '100%', background: palette.bg, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 60, position: 'relative' }}>
    <div style={{ position: 'absolute', top: 28, left: 32, fontFamily: "'Space Grotesk'", fontSize: 10, fontWeight: 600, letterSpacing: '0.2em', color: 'rgba(255,255,255,0.2)', textTransform: 'uppercase' }}>
      Proposal {num.toString().padStart(2,'0')} · {palette.name} · Dark
    </div>
    <HorizLockup Icon={Icon} palette={palette} white={true} onLight={false} />
  </div>
);

/* ─────────────────────────────────────────
   PROPOSAL CARD — ACCENT BG
───────────────────────────────────────── */
const ProposalAccent = ({ Icon, palette, num }) => (
  <div style={{ width: '100%', height: '100%', background: palette.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 60, position: 'relative' }}>
    <div style={{ position: 'absolute', top: 28, left: 32, fontFamily: "'Space Grotesk'", fontSize: 10, fontWeight: 600, letterSpacing: '0.2em', color: 'rgba(255,255,255,0.4)', textTransform: 'uppercase' }}>
      Proposal {num.toString().padStart(2,'0')} · Accent
    </div>
    <HorizLockup Icon={Icon} palette={{ ...palette, accent: '#FFFFFF' }} white={true} onLight={false} />
  </div>
);

/* ─────────────────────────────────────────
   ICON DETAIL ARTBOARD
───────────────────────────────────────── */
const IconDetail = ({ Icon, palette }) => (
  <div style={{ width: '100%', height: '100%', background: '#F4F4F2', display: 'flex', alignItems: 'center', justifyContent: 'space-around', padding: '40px 48px' }}>
    {/* Large icon on dark */}
    <div style={{ background: palette.bg, borderRadius: 12, width: 180, height: 180, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <Icon size={100} accent={palette.accent} bg={palette.bg} onLight={false} />
    </div>
    {/* Large icon on white */}
    <div style={{ background: '#FFFFFF', borderRadius: 12, width: 180, height: 180, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <Icon size={100} accent={palette.bg} bg="#FFFFFF" onLight={true} />
    </div>
    {/* Small sizes */}
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20, alignItems: 'center' }}>
      {[60, 40, 24, 16].map(s => (
        <div key={s} style={{ background: palette.bg, borderRadius: 6, width: s + 16, height: s + 16, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <Icon size={s} accent={palette.accent} bg={palette.bg} />
        </div>
      ))}
    </div>
  </div>
);

/* ─────────────────────────────────────────
   TYPOGRAPHY SYSTEM
───────────────────────────────────────── */
const TypeSystem = () => (
  <div style={{ width: '100%', height: '100%', background: '#0B1F3A', padding: '52px 64px', display: 'flex', flexDirection: 'column', gap: 0, justifyContent: 'center' }}>
    <div style={{ fontFamily: "'Space Grotesk'", fontSize: 9, fontWeight: 600, letterSpacing: '0.25em', color: 'rgba(255,255,255,0.3)', textTransform: 'uppercase', marginBottom: 40 }}>
      Typography System
    </div>
    {/* Display */}
    <div style={{ marginBottom: 32 }}>
      <div style={{ fontFamily: "'Space Grotesk'", fontSize: 9, color: '#C8933F', letterSpacing: '0.18em', textTransform: 'uppercase', marginBottom: 8 }}>Display · Space Grotesk 700</div>
      <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 52, color: '#FFFFFF', letterSpacing: '-0.02em', lineHeight: 1 }}>
        LUGONES
      </div>
    </div>
    {/* Heading */}
    <div style={{ marginBottom: 28 }}>
      <div style={{ fontFamily: "'Space Grotesk'", fontSize: 9, color: '#C8933F', letterSpacing: '0.18em', textTransform: 'uppercase', marginBottom: 8 }}>Heading · Space Grotesk 600</div>
      <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 600, fontSize: 28, color: '#FFFFFF', letterSpacing: '-0.01em', lineHeight: 1.2 }}>
        Scimitar Syndrome Repair
      </div>
    </div>
    {/* Label */}
    <div style={{ marginBottom: 28 }}>
      <div style={{ fontFamily: "'Space Grotesk'", fontSize: 9, color: '#C8933F', letterSpacing: '0.18em', textTransform: 'uppercase', marginBottom: 8 }}>Label · Space Grotesk 500, tracked</div>
      <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 500, fontSize: 13, color: 'rgba(255,255,255,0.7)', letterSpacing: '0.2em', textTransform: 'uppercase' }}>
        PERICARDIAL TUNNEL TECHNIQUE · SINCE 2012
      </div>
    </div>
    {/* Body */}
    <div style={{ marginBottom: 28 }}>
      <div style={{ fontFamily: "'Space Grotesk'", fontSize: 9, color: '#C8933F', letterSpacing: '0.18em', textTransform: 'uppercase', marginBottom: 8 }}>Body · DM Sans 400</div>
      <div style={{ fontFamily: "'DM Sans'", fontWeight: 400, fontSize: 15, color: 'rgba(255,255,255,0.65)', lineHeight: 1.65, maxWidth: 520, textWrap: 'pretty' }}>
        The Lugones procedure uses the pericardium as a natural autologous tunnel to reroute the scimitar vein into the left atrium — achieving wide-lumen, tension-free repair with no postoperative obstructions across 38 patients in 11 institutions.
      </div>
    </div>
    {/* Academic */}
    <div>
      <div style={{ fontFamily: "'Space Grotesk'", fontSize: 9, color: '#C8933F', letterSpacing: '0.18em', textTransform: 'uppercase', marginBottom: 8 }}>Academic · Crimson Pro 400i</div>
      <div style={{ fontFamily: "'Crimson Pro'", fontWeight: 400, fontSize: 18, fontStyle: 'italic', color: 'rgba(255,255,255,0.5)', lineHeight: 1.4 }}>
        "No deaths, no reoperations, 13.5-year maximum follow-up" — JTCVS 2025
      </div>
    </div>
  </div>
);

/* ─────────────────────────────────────────
   CONCEPT RATIONALE
───────────────────────────────────────── */
const Rationale = ({ icon, headline, copy, palette }) => (
  <div style={{ width: '100%', height: '100%', background: palette.light, padding: '44px 48px', display: 'flex', flexDirection: 'column', gap: 16 }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
      <div style={{ background: palette.bg, borderRadius: 8, width: 52, height: 52, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
        {icon}
      </div>
      <div>
        <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 17, color: palette.bg, letterSpacing: '-0.01em' }}>{headline}</div>
        <div style={{ fontFamily: "'Space Grotesk'", fontSize: 11, fontWeight: 500, color: palette.accent, letterSpacing: '0.15em', textTransform: 'uppercase', marginTop: 2 }}>Concept Rationale</div>
      </div>
    </div>
    <div style={{ width: '100%', height: 1, background: 'rgba(11,31,58,0.1)' }} />
    <div style={{ fontFamily: "'DM Sans'", fontWeight: 400, fontSize: 13.5, color: 'rgba(11,31,58,0.65)', lineHeight: 1.65, textWrap: 'pretty' }}>{copy}</div>
  </div>
);

const P2v2 = { bg: '#0B1F3A', accent: '#B52430', light: '#F5EDEF', mid: '#C48D96', name: 'Navy × Crimson V2' };
const P2v3 = { bg: '#0A1B33', accent: '#C03545', light: '#F6ECEE', mid: '#B88A91', name: 'Navy × Crimson V3' };

// V3 — "The Reroute, refined" — based on Proposal 02
// Concept: a single continuous gesture. The anomalous vein descends as a tapered
// scimitar curve (faded), is caught by the pericardial tunnel node, and a bold,
// decisive stroke redirects upward to the left atrium. Cleaner geometry, stronger
// node presence, balanced negative space.
const RerouteV3 = ({ size = 80, accent = P2v3.accent, bg = P2v3.bg, onLight = false }) => {
  const inner = onLight ? '#FFFFFF' : bg;
  return (
    <svg viewBox="0 0 80 80" width={size} height={size} fill="none" xmlns="http://www.w3.org/2000/svg">
      {/* Anomalous scimitar vein — tapered curve descending (the wrong path) */}
      <path
        d="M 18 8
           C 34 10 54 22 60 46
           C 61.5 52 61 58 58 62"
        stroke={accent} strokeWidth="6" strokeLinecap="round" opacity="0.14"
      />
      {/* Scimitar blade silhouette — subtle filled shape reinforcing the curve */}
      <path
        d="M 18 8
           C 34 10 54 22 60 46
           C 61.5 52 61 58 58 62
           C 55.5 64 52 63 50.5 60
           C 49 57 51.5 53 51 47
           C 50 30 34 18 18 14 Z"
        fill={accent} opacity="0.09"
      />
      {/* Origin dot — pulmonary vein source */}
      <circle cx="18" cy="8" r="3" fill={accent} opacity="0.3" />
      {/* Pericardial tunnel node — the catch point, the Lugones fix */}
      <circle cx="58" cy="62" r="11" fill={accent} />
      <circle cx="58" cy="62" r="4.5" fill={inner} />
      {/* Rerouted path — bold, decisive stroke to left atrium */}
      <path
        d="M 49 58
           C 38 52 22 46 10 42"
        stroke={accent} strokeWidth="6.5" strokeLinecap="round"
      />
      {/* Left atrium terminal */}
      <circle cx="10" cy="42" r="5.5" fill={accent} />
      <circle cx="10" cy="42" r="1.8" fill={inner} />
    </svg>
  );
};

/* ─────────────────────────────────────────
   VARIANT ICONS — P02 × Scimitar fusion
───────────────────────────────────────── */

// Variant A — "Blade + Reroute": scimitar blade (faded) with bold redirected path from tip
const VarA = ({ size = 80, accent = P2.accent, bg = P2.bg, onLight = false }) => (
  <svg viewBox="0 0 68 80" width={size * 68/80} height={size} fill="none">
    {/* Scimitar blade shape — the anomalous vein going wrong, faded */}
    <path
      d="M 12 76 C 2 56 4 30 22 14 C 38 0 62 4 62 16 C 62 24 48 26 36 34 C 24 42 18 58 14 76 Z"
      fill={accent} opacity="0.18"
    />
    {/* Pericardial tunnel node at blade tip */}
    <circle cx="62" cy="16" r="8.5" fill={accent} />
    {/* Rerouted path — exits node toward left atrium (upper left) */}
    <path d="M 62 16 C 50 8 28 4 8 10" stroke={accent} strokeWidth="5.5" strokeLinecap="round" />
    {/* Left atrium terminal */}
    <circle cx="8" cy="10" r="4.5" fill={accent} />
  </svg>
);

// Variant B — "Pure Vein Path": scimitar curve as stroke (the clinical shape), node + redirect
const VarB = ({ size = 80, accent = P2.accent, bg = P2.bg, onLight = false }) => (
  <svg viewBox="0 0 68 80" width={size * 68/80} height={size} fill="none">
    {/* Scimitar vein trace — the anomalous downward curve (clinical appearance) */}
    <path
      d="M 16 76 C 10 58 8 38 20 20 C 32 4 58 0 62 16"
      stroke={accent} strokeWidth="3.5" strokeLinecap="round" opacity="0.22"
    />
    {/* Pericardial tunnel catch node */}
    <circle cx="62" cy="16" r="9" fill={accent} />
    {/* Rerouted output path to left atrium */}
    <path d="M 62 16 C 50 10 28 6 8 12" stroke={accent} strokeWidth="5.5" strokeLinecap="round" />
    {/* Left atrium terminal node */}
    <circle cx="8" cy="12" r="4.5" fill={accent} />
    {/* Small inset dot on main node */}
    <circle cx="62" cy="16" r="3.5" fill={onLight ? '#fff' : bg} />
  </svg>
);

// Variant C — "Enclosed": scimitar curve wrapped by a pericardial arc, reroute exits the wrap
const VarC = ({ size = 80, accent = P2.accent, bg = P2.bg, onLight = false }) => (
  <svg viewBox="0 0 72 80" width={size * 72/80} height={size} fill="none">
    {/* Pericardial wrap arc — enclosing the tip of the scimitar */}
    <path d="M 36 4 A 30 30 0 0 1 66 34" stroke={accent} strokeWidth="4" strokeLinecap="round" opacity="0.45" />
    {/* Scimitar vein path (anomalous) */}
    <path
      d="M 14 76 C 8 56 10 34 24 18 C 38 4 64 2 64 18"
      stroke={accent} strokeWidth="3" strokeLinecap="round" opacity="0.22"
    />
    {/* Pericardial node */}
    <circle cx="64" cy="18" r="8" fill={accent} />
    {/* Rerouted path */}
    <path d="M 64 18 C 52 12 30 8 8 14" stroke={accent} strokeWidth="5.5" strokeLinecap="round" />
    {/* Left atrium */}
    <circle cx="8" cy="14" r="4.5" fill={accent} />
  </svg>
);

// Variant D — "One Path": a single continuous scimitar-shaped stroke that sweeps down then
//             is caught at the deepest curve point and redirects upward — one fluid gesture
const VarD = ({ size = 80, accent = P2.accent, bg = P2.bg, onLight = false }) => (
