<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Lugones Procedure — Sitemap</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0F1923; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0F1923; } ::-webkit-scrollbar-thumb { background: #2a3a4a; border-radius: 3px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

/* ─── TOKENS ─── */
const C = {
  navy:    '#0B1F3A',
  crimson: '#B52430',
  teal:    '#1AA6BE',
  gold:    '#C8933F',
  shared:  '#4A6FA5',
  bg:      '#0F1923',
  surface: '#162233',
  border:  'rgba(255,255,255,0.07)',
};

const AUDIENCE = {
  shared:   { label: 'Compartido',    color: C.shared,  bg: 'rgba(74,111,165,0.12)'  },
  patients: { label: 'Pacientes',     color: C.crimson, bg: 'rgba(181,36,48,0.12)'   },
  surgeons: { label: 'Cirujanos',     color: C.teal,    bg: 'rgba(26,166,190,0.12)'  },
  utility:  { label: 'Utilidad',      color: C.gold,    bg: 'rgba(200,147,63,0.12)'  },
};

/* ─── SITEMAP DATA ─── */
const SITEMAP = [
  {
    id: 'home',
    title: 'Home',
    url: '/',
    audience: 'shared',
    desc: 'Landing principal. Hero con propuesta de valor, estadísticas clave (38 pacientes, 11 centros, 0 reoperaciones), y dos CTAs diferenciados: pacientes y cirujanos.',
    content: ['Hero con ícono animado del procedimiento', 'Stats de resultados clínicos', 'Dos paths: paciente / cirujano', 'Últimas publicaciones / noticias', 'CTA principal: Agendar consulta'],
    children: [
      {
        id: 'syndrome',
        title: 'El Síndrome de la Cimitarra',
        url: '/scimitar-syndrome',
        audience: 'shared',
        desc: 'Explicación del síndrome para dos audiencias. Versión accesible para pacientes y familiar, versión técnica expandible para profesionales.',
        content: ['¿Qué es el Síndrome de la Cimitarra?', 'Anatomía de la vena anómala', 'Espectro clínico (infantil a adulto)', 'Por qué las técnicas clásicas fallan', 'Toggle: versión paciente / profesional'],
        children: [],
      },
      {
        id: 'procedure',
        title: 'El Procedimiento Lugones',
        url: '/the-procedure',
        audience: 'shared',
        desc: 'El corazón del sitio. Explicación del procedimiento con dos niveles de profundidad, las 3 variantes quirúrgicas y los resultados clínicos.',
        content: ['La solución: el túnel pericárdico', 'Animación/esquema del procedimiento', 'Variante Original', 'Variante A (reposicionamiento del septo)', 'Variante B (colgajo pericárdico interauricular)', 'Resultados mid-term (multicéntrico)'],
        children: [
          {
            id: 'proc-patients',
            title: 'Para tu Cirugía',
            url: '/the-procedure/for-patients',
            audience: 'patients',
            desc: 'Versión simplificada del procedimiento para pacientes y familias. Lenguaje accesible, ilustraciones, preguntas frecuentes.',
            content: ['¿Qué le van a hacer a mi hijo?', 'Antes, durante y después', 'Riesgos y resultados esperados', 'Preguntas frecuentes'],
            children: [],
          },
          {
            id: 'proc-surgeons',
            title: 'Detalle Técnico',
            url: '/the-procedure/technical',
            audience: 'surgeons',
            desc: 'Descripción técnica completa con figuras intraoperatorias, videos esquemáticos y las 3 variantes en detalle.',
            content: ['Pasos intraoperatorios paso a paso', 'Las 3 variantes con indicaciones', 'Figuras y fotos intraoperatorias', 'Videos esquemáticos', 'Acceso a preprints y papers'],
            children: [],
          },
        ],
      },
      {
        id: 'results',
        title: 'Resultados Clínicos',
        url: '/results',
        audience: 'shared',
        desc: 'Dashboard de resultados del estudio multicéntrico. 38 pacientes, 11 instituciones, seguimiento máximo de 13.5 años, 0 muertes, 0 reoperaciones.',
        content: ['Estadísticas principales (visualizadas)', 'Serie multicéntrica internacional', 'Imágenes de CT y RMN 4D-flow', 'Comparación con técnicas clásicas', 'Referencia al paper publicado'],
        children: [],
      },
      {
        id: 'patients',
        title: 'Para Pacientes',
        url: '/for-patients',
        audience: 'patients',
        desc: 'Sección dedicada al paciente y su familia. Desde entender el diagnóstico hasta agendar la consulta con el Dr. Lugones.',
        content: ['Entendé tu diagnóstico', 'El viaje del paciente (timeline)', 'Cómo venir desde el exterior', 'Testimonios / casos de éxito', 'Agendar consulta (Calendly)'],
        children: [
          {
            id: 'schedule',
            title: 'Agendar Consulta',
            url: '/for-patients/schedule',
            audience: 'utility',
            desc: 'Integración con Calendly o formulario de contacto. CTA principal del sitio. Consulta por video para pacientes internacionales.',
            content: ['Calendly embed o formulario', 'Consulta por videollamada', 'Documentación requerida', 'Información de contacto directo'],
            children: [],
          },
          {
            id: 'journey',
            title: 'Tu Viaje Quirúrgico',
            url: '/for-patients/journey',
            audience: 'patients',
            desc: 'Timeline visual del proceso: diagnóstico → consulta → cirugía → seguimiento. Incluye información práctica para pacientes del exterior.',
            content: ['Timeline pre/intra/post-operatorio', 'Cómo llegar a Buenos Aires', 'Hospital Austral: dónde y cómo', 'Alojamiento y logística'],
            children: [],
          },
        ],
      },
      {
        id: 'surgeons',
        title: 'Para Cirujanos',
        url: '/for-surgeons',
        audience: 'surgeons',
        desc: 'Hub de recursos para profesionales que quieren aprender la técnica, referir pacientes o colaborar con el Dr. Lugones.',
        content: ['Publicaciones y papers', 'Videos quirúrgicos', 'Solicitar entrenamiento', 'Enviar un caso para discusión', 'Red de centros adoptantes'],
        children: [
          {
            id: 'publications',
            title: 'Publicaciones',
            url: '/for-surgeons/publications',
            audience: 'surgeons',
            desc: 'Biblioteca de papers, incluyendo el estudio multicéntrico principal, publicaciones internacionales y material inédito.',
            content: ['Paper principal (JTCVS)', 'Papers de centros colaboradores', 'Preprints disponibles', 'Citas y métricas de impacto'],
            children: [],
          },
          {
            id: 'collaborate',
            title: 'Colaborar / Entrenar',
            url: '/for-surgeons/collaborate',
            audience: 'surgeons',
            desc: 'Canal para cirujanos que quieran aprender la técnica, visitar el centro, o establecer colaboración formal.',
            content: ['Solicitar observership', 'Protocolo de entrenamiento', 'Formulario de contacto profesional', 'Casos para segunda opinión'],
            children: [],
          },
        ],
      },
      {
        id: 'center',
        title: 'El Centro',
        url: '/the-center',
        audience: 'shared',
        desc: 'Presentación del centro internacional en Argentina. Dr. Lugones, Hospital Austral, y la red de centros adoptantes de la técnica.',
        content: ['Dr. Ignacio Lugones — bio y credentials', 'Hospital Austral, Pilar, Argentina', 'Red internacional de 11 centros', 'Misión: referencia global para la cimitarra', 'Prensa y menciones'],
        children: [],
      },
    ],
  },
];

/* ─── NODE COMPONENT ─── */
const SitemapNode = ({ node, depth = 0, selected, onSelect, isLast }) => {
  const aud = AUDIENCE[node.audience];
  const isSelected = selected === node.id;
  const hasChildren = node.children && node.children.length > 0;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start' }}>
      <div style={{ display: 'flex', alignItems: 'flex-start' }}>
        {/* Vertical + horizontal connector lines */}
        {depth > 0 && (
          <div style={{ position: 'relative', width: 32, marginTop: 20, flexShrink: 0 }}>
            <div style={{ position: 'absolute', left: 0, top: -24, bottom: isLast ? 20 : 0, width: 1, background: C.border }} />
            <div style={{ position: 'absolute', left: 0, top: 0, width: 24, height: 1, background: C.border }} />
          </div>
        )}

        {/* Node card */}
        <button
          onClick={() => onSelect(isSelected ? null : node.id)}
          style={{
            background: isSelected ? aud.bg : 'rgba(255,255,255,0.03)',
            border: `1px solid ${isSelected ? aud.color : C.border}`,
            borderRadius: 8,
            padding: '10px 14px',
            cursor: 'pointer',
            textAlign: 'left',
            transition: 'all 0.15s ease',
            minWidth: depth === 0 ? 180 : 160,
            maxWidth: 220,
          }}
        >
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
            <div style={{ width: 6, height: 6, borderRadius: '50%', background: aud.color, flexShrink: 0 }} />
            <div style={{ fontFamily: "'Space Grotesk'", fontWeight: depth === 0 ? 700 : 600, fontSize: depth === 0 ? 14 : 12, color: isSelected ? '#FFFFFF' : 'rgba(255,255,255,0.85)', letterSpacing: '-0.01em' }}>
              {node.title}
            </div>
          </div>
          <div style={{ fontFamily: "'Space Grotesk'", fontSize: 9, fontWeight: 500, color: aud.color, letterSpacing: '0.12em', textTransform: 'uppercase' }}>
            {node.url}
          </div>
        </button>
      </div>

      {/* Children */}
      {hasChildren && (
        <div style={{ display: 'flex', gap: 12, marginTop: 12, marginLeft: depth === 0 ? 0 : 32, paddingLeft: 32, position: 'relative' }}>
          {/* Horizontal line connecting children */}
          {node.children.length > 1 && (
            <div style={{
              position: 'absolute', left: 32, top: 20,
              width: `calc(100% - 32px - ${node.children.length > 1 ? 110 : 0}px)`,
              height: 1, background: C.border,
            }} />
          )}
          {node.children.map((child, i) => (
            <SitemapNode
              key={child.id}
              node={child}
              depth={depth + 1}
              selected={selected}
              onSelect={onSelect}
              isLast={i === node.children.length - 1}
            />
          ))}
        </div>
      )}
    </div>
  );
};

/* ─── DETAIL PANEL ─── */
const findNode = (nodes, id) => {
  for (const n of nodes) {
    if (n.id === id) return n;
    const found = findNode(n.children || [], id);
    if (found) return found;
  }
  return null;
};

const DetailPanel = ({ nodeId, onClose }) => {
  const node = findNode(SITEMAP, nodeId);
  if (!node) return null;
  const aud = AUDIENCE[node.audience];

  return (
    <div style={{
      position: 'fixed', right: 0, top: 0, bottom: 0, width: 360,
      background: C.surface, borderLeft: `1px solid ${C.border}`,
      display: 'flex', flexDirection: 'column', zIndex: 100,
      animation: 'slideIn 0.2s ease',
    }}>
      <style>{`@keyframes slideIn { from { transform: translateX(100%) } to { transform: translateX(0) } }`}</style>
      
      {/* Header */}
      <div style={{ padding: '24px 28px 20px', borderBottom: `1px solid ${C.border}` }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
          <div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
              <div style={{ width: 8, height: 8, borderRadius: '50%', background: aud.color }} />
              <div style={{ fontFamily: "'Space Grotesk'", fontSize: 10, fontWeight: 600, color: aud.color, letterSpacing: '0.15em', textTransform: 'uppercase' }}>{aud.label}</div>
            </div>
            <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 18, color: '#FFFFFF', letterSpacing: '-0.01em' }}>{node.title}</div>
            <div style={{ fontFamily: "'Space Grotesk'", fontSize: 11, color: 'rgba(255,255,255,0.35)', marginTop: 4 }}>{node.url}</div>
          </div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'rgba(255,255,255,0.4)', fontSize: 20, lineHeight: 1, padding: 4 }}>×</button>
        </div>
      </div>

      {/* Description */}
      <div style={{ padding: '20px 28px', borderBottom: `1px solid ${C.border}` }}>
        <div style={{ fontFamily: "'DM Sans'", fontSize: 13, color: 'rgba(255,255,255,0.6)', lineHeight: 1.65, textWrap: 'pretty' }}>{node.desc}</div>
      </div>

      {/* Content list */}
      <div style={{ padding: '20px 28px', flex: 1, overflowY: 'auto' }}>
        <div style={{ fontFamily: "'Space Grotesk'", fontSize: 10, fontWeight: 600, color: 'rgba(255,255,255,0.3)', letterSpacing: '0.15em', textTransform: 'uppercase', marginBottom: 14 }}>Contenido propuesto</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {node.content.map((item, i) => (
            <div key={i} style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
              <div style={{ width: 4, height: 4, borderRadius: '50%', background: aud.color, marginTop: 6, flexShrink: 0 }} />
              <div style={{ fontFamily: "'DM Sans'", fontSize: 13, color: 'rgba(255,255,255,0.7)', lineHeight: 1.5 }}>{item}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

/* ─── LEGEND ─── */
const Legend = () => (
  <div style={{ display: 'flex', gap: 20, alignItems: 'center' }}>
    {Object.entries(AUDIENCE).map(([key, val]) => (
      <div key={key} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        <div style={{ width: 8, height: 8, borderRadius: '50%', background: val.color }} />
        <div style={{ fontFamily: "'Space Grotesk'", fontSize: 11, color: 'rgba(255,255,255,0.5)', fontWeight: 500 }}>{val.label}</div>
      </div>
    ))}
  </div>
);

/* ─── STATS BAR ─── */
const allNodes = (nodes) => nodes.flatMap(n => [n, ...allNodes(n.children || [])]);
const countByAudience = (nodes, aud) => allNodes(nodes).filter(n => n.audience === aud).length;

/* ─── APP ─── */
const App = () => {
  const [selected, setSelected] = useState(null);
  const total = allNodes(SITEMAP).length;

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      {/* Header */}
      <div style={{ borderBottom: `1px solid ${C.border}`, padding: '20px 40px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div>
          <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 16, color: '#FFFFFF', letterSpacing: '-0.01em' }}>
            The Lugones Procedure
          </div>
          <div style={{ fontFamily: "'Space Grotesk'", fontSize: 10, fontWeight: 500, color: C.crimson, letterSpacing: '0.18em', textTransform: 'uppercase', marginTop: 2 }}>
            Sitemap · Propuesta v1
          </div>
        </div>
        <div style={{ display: 'flex', gap: 28, alignItems: 'center' }}>
          <Legend />
          <div style={{ width: 1, height: 28, background: C.border }} />
          <div style={{ display: 'flex', gap: 16 }}>
            {[
              { n: total, label: 'páginas' },
              { n: countByAudience(SITEMAP, 'patients'), label: 'pacientes' },
              { n: countByAudience(SITEMAP, 'surgeons'), label: 'cirujanos' },
            ].map(({ n, label }) => (
              <div key={label} style={{ textAlign: 'center' }}>
                <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 20, color: '#FFFFFF' }}>{n}</div>
                <div style={{ fontFamily: "'Space Grotesk'", fontSize: 9, color: 'rgba(255,255,255,0.35)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>{label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Hint */}
      <div style={{ padding: '12px 40px', borderBottom: `1px solid ${C.border}`, background: 'rgba(181,36,48,0.06)' }}>
        <div style={{ fontFamily: "'DM Sans'", fontSize: 12, color: 'rgba(255,255,255,0.4)', fontStyle: 'italic' }}>
          Hacé click en cualquier nodo para ver el detalle de contenido propuesto. Esta es una propuesta inicial — revisala y decinos qué agregar, quitar o reorganizar.
        </div>
      </div>

      {/* Canvas */}
      <div style={{ flex: 1, overflowX: 'auto', overflowY: 'auto', padding: '48px 40px 80px' }}>
        <div style={{ minWidth: 900 }}>
          {/* Top-level label */}
          <div style={{ fontFamily: "'Space Grotesk'", fontSize: 10, fontWeight: 600, color: 'rgba(255,255,255,0.2)', letterSpacing: '0.2em', textTransform: 'uppercase', marginBottom: 28 }}>
            Arquitectura de información
          </div>

          {/* Home node + children row */}
          {SITEMAP.map(node => (
            <div key={node.id}>
              {/* Home */}
              <button
                onClick={() => setSelected(selected === node.id ? null : node.id)}
                style={{
                  background: selected === node.id ? AUDIENCE[node.audience].bg : 'rgba(255,255,255,0.04)',
                  border: `1px solid ${selected === node.id ? AUDIENCE[node.audience].color : C.border}`,
                  borderRadius: 10, padding: '14px 20px', cursor: 'pointer', textAlign: 'left',
                  marginBottom: 24,
                }}
              >
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                  <div style={{ width: 8, height: 8, borderRadius: '50%', background: AUDIENCE[node.audience].color }} />
                  <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 700, fontSize: 16, color: '#FFFFFF' }}>
                    {node.title}
                  </div>
                  <div style={{ fontFamily: "'Space Grotesk'", fontSize: 10, fontWeight: 500, color: 'rgba(255,255,255,0.4)', letterSpacing: '0.1em' }}>
                    {node.url}
                  </div>
                </div>
                <div style={{ fontFamily: "'DM Sans'", fontSize: 12, color: 'rgba(255,255,255,0.4)', maxWidth: 400 }}>
                  {node.desc.split('.')[0]}.
                </div>
              </button>

              {/* Children row */}
              <div style={{ display: 'flex', gap: 0, alignItems: 'flex-start', position: 'relative', paddingBottom: 40 }}>
                {/* Horizontal connector from home */}
                <div style={{ position: 'absolute', top: 20, left: 0, right: 0, height: 1, background: C.border }} />

                {node.children.map((child, ci) => (
                  <div key={child.id} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', minWidth: 0 }}>
                    {/* Vertical drop from horizontal line */}
                    <div style={{ width: 1, height: 20, background: C.border }} />
                    {/* Child card */}
                    <button
                      onClick={() => setSelected(selected === child.id ? null : child.id)}
                      style={{
                        background: selected === child.id ? AUDIENCE[child.audience].bg : 'rgba(255,255,255,0.04)',
                        border: `1px solid ${selected === child.id ? AUDIENCE[child.audience].color : C.border}`,
                        borderRadius: 8, padding: '10px 14px', cursor: 'pointer', textAlign: 'left',
                        width: 'calc(100% - 24px)', maxWidth: 180, transition: 'all 0.15s',
                      }}
                    >
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                        <div style={{ width: 6, height: 6, borderRadius: '50%', background: AUDIENCE[child.audience].color, flexShrink: 0 }} />
                        <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 600, fontSize: 12, color: '#FFFFFF', lineHeight: 1.2 }}>
                          {child.title}
                        </div>
                      </div>
                      <div style={{ fontFamily: "'Space Grotesk'", fontSize: 9, color: AUDIENCE[child.audience].color, letterSpacing: '0.1em', textTransform: 'uppercase' }}>
                        {child.url}
                      </div>
                    </button>

                    {/* Sub-children */}
                    {child.children && child.children.length > 0 && (
                      <div style={{ width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', marginTop: 0, position: 'relative' }}>
                        {/* Vertical drop from child */}
                        <div style={{ width: 1, height: 16, background: C.border }} />
                        {/* Horizontal line for sub-children */}
                        {child.children.length > 1 && (
                          <div style={{ width: '70%', height: 1, background: C.border }} />
                        )}
                        <div style={{ display: 'flex', gap: 0, width: '100%', justifyContent: 'center' }}>
                          {child.children.map((sub) => (
                            <div key={sub.id} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                              <div style={{ width: 1, height: child.children.length > 1 ? 12 : 0, background: C.border }} />
                              <button
                                onClick={() => setSelected(selected === sub.id ? null : sub.id)}
                                style={{
                                  background: selected === sub.id ? AUDIENCE[sub.audience].bg : 'rgba(255,255,255,0.025)',
                                  border: `1px solid ${selected === sub.id ? AUDIENCE[sub.audience].color : 'rgba(255,255,255,0.05)'}`,
                                  borderRadius: 6, padding: '8px 10px', cursor: 'pointer', textAlign: 'left',
                                  width: 'calc(100% - 16px)', maxWidth: 150, transition: 'all 0.15s',
                                }}
                              >
                                <div style={{ display: 'flex', alignItems: 'center', gap: 5, marginBottom: 2 }}>
                                  <div style={{ width: 5, height: 5, borderRadius: '50%', background: AUDIENCE[sub.audience].color, flexShrink: 0 }} />
                                  <div style={{ fontFamily: "'Space Grotesk'", fontWeight: 500, fontSize: 11, color: 'rgba(255,255,255,0.8)', lineHeight: 1.2 }}>
                                    {sub.title}
                                  </div>
                                </div>
                                <div style={{ fontFamily: "'Space Grotesk'", fontSize: 8, color: AUDIENCE[sub.audience].color, letterSpacing: '0.08em', textTransform: 'uppercase' }}>
                                  {sub.url}
                                </div>
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          ))}

          {/* Notes */}
          <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 32, marginTop: 8 }}>
            <div style={{ fontFamily: "'Space Grotesk'", fontSize: 10, fontWeight: 600, color: 'rgba(255,255,255,0.2)', letterSpacing: '0.18em', textTransform: 'uppercase', marginBottom: 16 }}>
              Decisiones pendientes
            </div>
            <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
              {[
                '¿Blog / News o solo publicaciones estáticas?',
                '¿Casos de pacientes públicos o solo con contraseña?',
                '¿Videos quirúrgicos abiertos o requieren registro?',
                '¿Idioma: inglés primario + español secundario?',
                '¿Calendly embed o formulario propio?',
                '¿Sección de prensa / menciones en medios?',
              ].map((q, i) => (
                <div key={i} style={{
                  background: 'rgba(200,147,63,0.08)', border: '1px solid rgba(200,147,63,0.2)',
                  borderRadius: 6, padding: '8px 14px',
                  fontFamily: "'DM Sans'", fontSize: 12, color: 'rgba(255,255,255,0.55)',
                  fontStyle: 'italic',
                }}>
                  {q}
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* Detail Panel */}
      {selected && <DetailPanel nodeId={selected} onClose={() => setSelected(null)} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
